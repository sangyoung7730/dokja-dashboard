  try{await open_(pw);if(document.getElementById('rm')&&document.getElementById('rm').checked)localStorage.setItem('dokja_pw',pw);}
  catch(x){m.textContent='비밀번호가 맞지 않습니다';}};
const saved=localStorage.getItem('dokja_pw');
if(saved){m.textContent='여는 중…';open_(saved).catch(()=>{localStorage.removeItem('dokja_pw');m.textContent='';});}
</script></body></html>
